<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aldeões · Bancada</title>
  <meta name="description" content="As trocas de todos os aldeões do Minecraft, por profissão e nível: o que eles compram e o que vendem.">
  <meta name="theme-color" content="#171c19">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="duas duas-larga">
    <section class="painel" aria-labelledby="t-prof">
      <div class="painel-cab">
        <h2 id="t-prof">Profissões</h2>
        <span class="rotulo" id="contagem"></span>
      </div>
      <div class="busca">
        <label class="sr" for="busca">Buscar item</label>
        <input id="busca" type="search" placeholder="Buscar item: ender, livro, diamante…" autocomplete="off" spellcheck="false">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar"></div>
      <div class="rolagem">
        <ul class="lista-farms" id="lista"></ul>
        <div class="como" id="dicas"></div>
      </div>
    </section>

    <section class="painel" aria-labelledby="t-det">
      <h2 class="sr" id="t-det">Trocas</h2>
      <div class="rolagem" id="detalhe"></div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <script type="module" src="js/aldeoes.js"></script>
</body>
</html>
