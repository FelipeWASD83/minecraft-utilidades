<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farms · Bancada</title>
  <meta name="description" content="Como montar as farms mais úteis do Minecraft: comida, ferro, ouro, XP, pérolas e varetas de blaze.">
  <meta name="theme-color" content="#171c19">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="duas duas-larga">
    <section class="painel" aria-labelledby="t-farms">
      <div class="painel-cab">
        <h2 id="t-farms">Farms</h2>
        <span class="rotulo" id="contagem"></span>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
      <div class="rolagem">
        <ul class="lista-farms" id="lista"></ul>
      </div>
    </section>

    <section class="painel" aria-labelledby="t-det">
      <h2 class="sr" id="t-det">Detalhes da farm</h2>
      <div class="rolagem" id="detalhe"></div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <script type="module" src="js/farms.js"></script>
</body>
</html>
