<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poções · Bancada</title>
  <meta name="description" content="Todas as poções do Minecraft: ingrediente, passo a passo no suporte de poções e duração de cada versão.">
  <meta name="theme-color" content="#171c19">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="duas">
    <section class="painel" aria-labelledby="t-prep">
      <div class="painel-cab">
        <h2 id="t-prep">Passo a passo</h2>
      </div>
      <div id="prep"></div>
      <div class="como" id="suporte"></div>
    </section>

    <section class="painel" aria-labelledby="t-lista">
      <div class="painel-cab">
        <h2 id="t-lista">Poções</h2>
        <span class="rotulo" id="contagem"></span>
      </div>
      <div class="busca">
        <label class="sr" for="busca">Buscar poção</label>
        <input id="busca" type="search" placeholder="Buscar: cura, fogo, invisível…" autocomplete="off" spellcheck="false">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
      <div class="cartoes" id="cartoes"></div>
      <p class="sem-itens" id="vazio" hidden>Nenhuma poção com esse filtro.</p>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <script type="module" src="js/pocoes.js"></script>
</body>
</html>
